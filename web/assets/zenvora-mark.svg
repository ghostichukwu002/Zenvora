<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ZENVORA">
  <!-- A Z drawn as one continuous movement: across, down the diagonal, and across again.
       The dot marks arrival, a nod to discovery and delivery. -->
  <rect width="32" height="32" rx="9" fill="#12372A"/>
  <path d="M9.5 10.5 H22.5 L9.5 21.5 H22.5" fill="none" stroke="#D1FAE5" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="22.5" cy="21.5" r="2.1" fill="#34D399"/>
</svg>
